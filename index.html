function startWind(d){pitchQ=1-clamp(d/.5,0,1);if(ON){const rv0=(1-pitchQ)*.5*Math.sqrt(Math.random())+.03*Math.random(),aa0=Math.random()*6.283;pitch.aimX+=Math.cos(aa0)*rv0;pitch.aimY+=Math.sin(aa0)*rv0;pitch.noised=true;ON.seq++;netSend({t:'wind',pi:pSel,aimX:pitch.aimX,aimY:pitch.aimY,q:pitchQ})}const z=pitchQ>.7?2:pitchQ>.35?1:0;popText(['BAD','GOOD','PERFECT!'][z],['#9aa5c8','#ffd23f','#ff6a4a'][z]);ringOn=false;$('pring').style.display='none';$('pui').className='';windup=true;wp=0;$('pthrow').textContent='投球中'}

/* ===== オンライン対戦（PeerJS / WebRTC） ===== */
const LOBBY_ID='fuchu-baseball-lobby-v1';
function seededRun(seed,fn){if(seed==null)return fn();const o=Math.random;let a=seed>>>0;Math.random=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};try{return fn()}finally{Math.random=o}}
function netSend(o){if(ON&&ON.conn&&ON.conn.open){try{ON.conn.send(o)}catch(e){}}}
function onl(t,sub){$('onlT').textContent=t;$('onlS').textContent=sub||''}
function peerCtor(){const c=[typeof Peer!=='undefined'?Peer:null,window.peerjs&&window.peerjs.Peer,typeof Peer!=='undefined'&&Peer&&Peer.Peer,typeof Peer!=='undefined'&&Peer&&Peer.default];return c.find(x=>typeof x==='function')||null}
const PCFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turns:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]}};   // STUN+中継(TURN)：回線によって直接つながらない場合の保険
function mmStop(destroy){if(!MM)return;clearTimeout(MM.t);MM.dead=true;if(destroy){try{MM.peer&&MM.peer.destroy()}catch(e){}}MM=null}
function mmStart(){
 $('mode').classList.remove('show');$('onl').classList.add('show');
 const PC=peerCtor();if(!PC){onl('通信ライブラリを読み込めませんでした','ネットワーク接続を確認して、ページを開き直してください');return}
 onl('対戦相手を探しています…','同じ「オンライン対戦」を押した人とつながります');
 const me=MM={peer:null,t:null,dead:false,conn:null};
 const retry=()=>{if(me.dead)return;try{me.peer&&me.peer.destroy()}catch(e){}me.peer=null;me.conn=null;me.t=setTimeout(tryHost,500+Math.random()*1000)};
 const tryHost=()=>{if(me.dead)return;let pr;try{pr=new PC(LOBBY_ID,PCFG)}catch(e){onl('接続できませんでした',String(e&&e.message||e));return}
  me.peer=pr;
  pr.on('open',()=>{if(!me.dead)onl('対戦相手を待っています…','別の端末・タブで「オンライン対戦」を押してください')});
  pr.on('connection',c=>{if(me.dead||me.conn){try{c.close()}catch(e){}return}me.conn=c;onl('対戦相手が見つかりました','接続中…');me.t=setTimeout(()=>{if(!me.dead&&me.conn===c&&!c.open){me.conn=null;try{c.close()}catch(e){}onl('対戦相手を待っています…','（前の接続に失敗したため再待機）')}},15000);c.on('open',()=>{try{pr.disconnect()}catch(e){}onlineBegin(c,'host',pr)});c.on('error',()=>{})});
  pr.on('error',err=>{if(me.dead)return;if(err.type==='unavailable-id'){try{pr.destroy()}catch(e){}me.peer=null;tryGuest()}else{onl('通信エラー（再試行中）',String(err.type||''));retry()}})};
 const tryGuest=()=>{if(me.dead)return;let pr;try{pr=new PC(PCFG)}catch(e){onl('接続できませんでした',String(e&&e.message||e));return}
  me.peer=pr;let opened=false;onl('対戦相手を探しています…','相手の待機を確認中');
  pr.on('open',()=>{if(me.dead)return;onl('対戦相手に接続中…','相手が見つかりました。つながるまで少しお待ちください');const c=pr.connect(LOBBY_ID,{reliable:true});me.conn=c;me.t=setTimeout(()=>{if(!opened&&!me.dead){onl('つながりません。再試行します…','回線の制限などで相手と直接つながらない可能性があります');try{c.close()}catch(e){}retry()}},15000);c.on('open',()=>{opened=true;clearTimeout(me.t);onlineBegin(c,'guest',pr)});c.on('close',()=>{if(!opened)retry()});c.on('error',()=>{if(!opened)retry()})});
  pr.on('error',err=>{if(me.dead||opened)return;retry()})};
 tryHost()}
function onlineBegin(c,role,pr){if(!MM||MM.dead)return;mmStop(false);
 ON={conn:c,peer:pr,role,seq:0,ready:false,pendWind:null,pend:null,sync:null,over:false};
 c.on('data',onNetData);c.on('close',()=>{if(ON&&!ON.over){ON.over=true;clearTimeout(rT);clearTimeout(pT);showEnd('接続が切れました','相手との通信が途切れたため試合を終了します')}});c.on('error',()=>{});
 $('onl').classList.remove('show');userTop=role==='host';tut.steal=tut.pitch=tut.bat=1;

 msg(userTop?'先攻：まずバッターです':'後攻：まずピッチャーです','#f1c40f')}

 if(m.t==='wind'){ON.pendWind=m;tryApplyWind()}
 else if(m.t==='swing')remoteSwing(m);
 else if(m.t==='pend')ON.pend=m;

 pitch={...PT[m.pi]};pitch.ax*=7;pitch.ay*=7;pitch.aimX=m.aimX;pitch.aimY=m.aimY;pitch.late=true;pitch.noised=true;tx=m.aimX;ty=m.aimY;pitchQ=m.q;windup=true;wp=0}

 if(m.h){info={v:V(m.v[0],m.v[1],m.v[2]),C:V(m.IC[0],m.IC[1],m.IC[2]),note:m.note,ang:m.ang,q:m.q,bunt:m.ib,safe:m.safe,kind:m.kind,seed:m.seed};info.sim=simBall(info.C,info.v);if(info.bunt)info.sim.bunt={safe:info.safe}}
 finishPlan(m.pk,!!m.h,!!m.bunt,{x:m.rx,y:m.ry});if(m.bunt)buntSt=true}

 balls=m.b;strikes=m.s;outs=m.o;scA=m.a;scB=m.c;m.la.forEach((v,i)=>{lnA[i]=v});m.lb.forEach((v,i)=>{lnB[i]=v});fixBases(m.ob);updUI()}
